# yaml-language-server: $schema=https://raw.githubusercontent.com/DavidAnson/markdownlint/refs/heads/main/schema/markdownlint-config-schema-strict.json

MD003:
  style: atx

MD004:
  style: asterisk

MD009:
  br_spaces: 0
  code_blocks: true
  strict: true

MD010:
  spaces_per_tab: 2

MD029:
  style: ordered

MD035:
  style: ---

# The markdown files in this project are generally intended to be embedded
# (e.g. in the repo browser or in GitHub pages), so don't represent
# standalone documents requiring a top-level heading.
MD041: false

MD046:
  style: fenced

MD048:
  style: backtick

MD049:
  style: asterisk

MD050:
  style: asterisk

MD054:
  collapsed: false
  url_inline: false

MD055:
  style: leading_and_trailing

MD059:
  prohibited_texts:
    - click here for more
    - click here on the link for more
    - click here on the link
    - click here on this link for more
    - click here on this link
    - click here
    - click on the link for more
    - click on the link here for more
    - click on the link here
    - click on the link
    - click on this link for more
    - click on this link here for more
    - click on this link here
    - click on this link
    - click the link for more
    - click the link
    - click this link for more
    - click this link
    - here for more
    - here on the link for more
    - here on the link
    - here on this link for more
    - here on this link
    - here
    - link
    - more
    - on the link for more
    - on the link here for more
    - on the link here
    - on the link
    - on this link for more
    - on this link here for more
    - on this link here
    - on this link
    - the link for more
    - the link
    - this link for more
    - this link
    - this
